name: Release

on:
  push:
    tags:
      - 'vscode-cxx@*'
      - '@jk2908/cxx@*'

jobs:
  vscode:
    if: startsWith(github.ref, 'refs/tags/vscode-cxx@')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun x @vscode/vsce package --no-yarn --no-dependencies
        working-directory: packages/vscode-cxx
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/vscode-cxx/*.vsix
          fail_on_unmatched_files: true

  cxx:
    if: startsWith(github.ref, 'refs/tags/@jk2908/cxx@')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#@jk2908/cxx@}"
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/cxx/CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

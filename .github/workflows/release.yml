name: Release

on:
  push:
    tags:
      - 'vscode-cxx@*'

jobs:
  vscode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun x @vscode/vsce package --no-yarn --no-dependencies
        working-directory: packages/vscode-cxx
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/vscode-cxx/*.vsix
          fail_on_unmatched_files: true
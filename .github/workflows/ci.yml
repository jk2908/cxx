name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run test
        working-directory: packages/cxx
      - run: bun run build
        working-directory: packages/cxx
      - run: bun x vite build
        working-directory: examples/vite
      - run: bun x next build --turbopack
        working-directory: examples/next
      - run: bun x next build --webpack
        working-directory: examples/next
